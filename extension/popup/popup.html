<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 200px;
      padding: 14px 16px;
      background: #1a1a1a;
      color: #f0f0f0;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.on  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.off { background: #ef4444; }
    .label { font-size: 14px; font-weight: 600; }
    .sub   { font-size: 11px; color: #888; margin-top: 4px; padding-left: 20px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="dot" id="dot"></div>
    <div class="label" id="label">Checking…</div>
  </div>
  <div class="sub" id="sub"></div>
  <script src="popup.js"></script>
</body>
</html>
